basePath: /
definitions:
  controllers.DadosCardDoc:
    properties:
      dados:
        $ref: '#/definitions/models.DadosCard'
      sucesso:
        example: true
        type: boolean
    type: object
  controllers.DadosDashboardDoc:
    properties:
      dados:
        $ref: '#/definitions/models.DadosDashboard'
      sucesso:
        example: true
        type: boolean
    type: object
  controllers.DashboardDetalheDoc:
    properties:
      dados:
        $ref: '#/definitions/models.DashboardDetalhe'
      sucesso:
        example: true
        type: boolean
    type: object
  controllers.ErroDoc:
    properties:
      erro:
        example: mensagem de erro
        type: string
      sucesso:
        example: false
        type: boolean
    type: object
  controllers.HealthResposta:
    properties:
      banco:
        example: ok
        type: string
      status:
        example: ok
        type: string
    type: object
  controllers.ListaDashboardsDoc:
    properties:
      dados:
        $ref: '#/definitions/models.ListaDashboards'
      sucesso:
        example: true
        type: boolean
    type: object
  controllers.LoginRespostaDoc:
    properties:
      dados:
        $ref: '#/definitions/models.LoginResposta'
      sucesso:
        example: true
        type: boolean
    type: object
  controllers.MeRespostaDoc:
    properties:
      dados:
        $ref: '#/definitions/models.MeResposta'
      sucesso:
        example: true
        type: boolean
    type: object
  controllers.OpcoesFiltrosDoc:
    properties:
      dados:
        $ref: '#/definitions/models.OpcoesFiltros'
      sucesso:
        example: true
        type: boolean
    type: object
  models.CardMeta:
    properties:
      codigo:
        example: proj-01
        type: string
      descricao:
        example: Mostra quanto do trabalho planejado já foi concluído.
        type: string
      tipo:
        example: numero
        type: string
      titulo:
        example: Progresso
        type: string
    type: object
  models.CardResultado:
    properties:
      alerta:
        type: object
      atualizado_em:
        example: "2026-11-14T12:00:00-03:00"
        type: string
      codigo:
        example: proj-04
        type: string
      dados:
        type: object
      erro:
        example: ""
        type: string
      tipo:
        example: linhas
        type: string
      titulo:
        example: Evolução do projeto (burn-up)
        type: string
    type: object
  models.DadosCard:
    properties:
      card:
        $ref: '#/definitions/models.CardResultado'
      filtros_aplicados:
        $ref: '#/definitions/models.Filtros'
    type: object
  models.DadosDashboard:
    properties:
      cards:
        items:
          $ref: '#/definitions/models.CardResultado'
        type: array
      dashboard:
        $ref: '#/definitions/models.DashboardRef'
      filtros_aplicados:
        $ref: '#/definitions/models.Filtros'
    type: object
  models.DashboardDetalhe:
    properties:
      cards:
        items:
          $ref: '#/definitions/models.CardMeta'
        type: array
      chave:
        example: projetos
        type: string
      descricao:
        example: Andamento dos projetos em desenvolvimento.
        type: string
      id:
        example: 1
        type: integer
      titulo:
        example: Projetos
        type: string
    type: object
  models.DashboardRef:
    properties:
      chave:
        example: projetos
        type: string
      id:
        example: 1
        type: integer
      titulo:
        example: Projetos
        type: string
    type: object
  models.DashboardResumo:
    properties:
      chave:
        example: projetos
        type: string
      descricao:
        example: Andamento dos projetos em desenvolvimento.
        type: string
      id:
        example: 1
        type: integer
      titulo:
        example: Projetos
        type: string
      total_cards:
        example: 15
        type: integer
    type: object
  models.Filtros:
    properties:
      ate:
        example: "2026-11-14"
        type: string
      de:
        example: "2026-10-16"
        type: string
      escopo:
        example: projeto
        type: string
      id:
        example: 3
        type: integer
      modelo:
        items:
          type: string
        type: array
      origem_lead:
        items:
          type: string
        type: array
      status_projeto:
        items:
          type: string
        type: array
      tipo_projeto:
        example:
        - web
        items:
          type: string
        type: array
    type: object
  models.ListaDashboards:
    properties:
      dashboards:
        items:
          $ref: '#/definitions/models.DashboardResumo'
        type: array
    type: object
  models.LoginInput:
    properties:
      email:
        example: diretoria@pulso.local
        type: string
      senha:
        example: sua_senha
        type: string
    required:
    - email
    - senha
    type: object
  models.LoginResposta:
    properties:
      expira_em:
        example: "2026-11-15T12:00:00-03:00"
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      usuario:
        $ref: '#/definitions/models.UsuarioResumo'
    type: object
  models.MeResposta:
    properties:
      email:
        example: diretoria@pulso.local
        type: string
      id:
        example: 5b1f8a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
        type: string
      nome:
        example: Diretoria (dev)
        type: string
      perfil:
        $ref: '#/definitions/models.PerfilResumo'
    type: object
  models.OpcaoEnum:
    properties:
      rotulo:
        example: Web
        type: string
      valor:
        example: web
        type: string
    type: object
  models.OpcoesFiltros:
    properties:
      modelos:
        example:
        - claude-sonnet
        items:
          type: string
        type: array
      origens:
        example:
        - indicacao
        items:
          type: string
        type: array
      projetos:
        items:
          $ref: '#/definitions/models.ProjetoOpcao'
        type: array
      sprints:
        items:
          $ref: '#/definitions/models.SprintOpcao'
        type: array
      status_projeto:
        items:
          $ref: '#/definitions/models.OpcaoEnum'
        type: array
      times:
        items:
          $ref: '#/definitions/models.TimeOpcao'
        type: array
      tipos_projeto:
        items:
          $ref: '#/definitions/models.OpcaoEnum'
        type: array
    type: object
  models.PerfilResumo:
    properties:
      descricao:
        example: Acesso a todos os dashboards e cards, incluindo vendas.
        type: string
      id:
        example: 1
        type: integer
      nome:
        example: diretoria
        type: string
    type: object
  models.ProjetoOpcao:
    properties:
      id:
        example: 3
        type: integer
      nome:
        example: Portal do Cliente
        type: string
      status:
        example: em_andamento
        type: string
      tipo:
        example: web
        type: string
    type: object
  models.SprintOpcao:
    properties:
      atual:
        example: true
        type: boolean
      fim:
        example: "2026-11-14"
        type: string
      id:
        example: 4
        type: integer
      inicio:
        example: "2026-11-03"
        type: string
      numero:
        example: 12
        type: integer
      time_id:
        example: 1
        type: integer
      time_nome:
        example: Time Alfa
        type: string
    type: object
  models.TimeOpcao:
    properties:
      id:
        example: 1
        type: integer
      nome:
        example: Time Alfa
        type: string
    type: object
  models.UsuarioResumo:
    properties:
      email:
        example: diretoria@pulso.local
        type: string
      id:
        example: 5b1f8a2e-3c4d-4e5f-8a9b-0c1d2e3f4a5b
        type: string
      nome:
        example: Diretoria (dev)
        type: string
      perfil:
        example: diretoria
        type: string
    type: object
info:
  contact: {}
  description: |-
    API do Pulso, o dashboard de BI da Fábrica de Software. Toda a regra de cálculo dos cards fica aqui; o front só desenha o que a API devolve.
    Para usar as rotas protegidas: faça POST /auth/login, copie o "token" da resposta, clique em "Authorize" e informe "Bearer <token>".
  title: Pulso API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica com e-mail e senha de um usuário ativo e devolve um JWT
        (HS256). Qualquer falha de credencial devolve 401 com a mesma mensagem genérica.
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.LoginRespostaDoc'
        "400":
          description: Corpo inválido ou campos vazios
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "401":
          description: E-mail ou senha inválidos
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Devolve os dados do usuário dono do token e do perfil dele.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.MeRespostaDoc'
        "401":
          description: Sem token, token inválido ou usuário inativo
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
      security:
      - BearerAuth: []
      summary: Usuário logado
      tags:
      - auth
  /cards/{codigo}/dados:
    get:
      consumes:
      - application/json
      description: 'Calcula um card para os filtros informados. Os filtros valem conforme
        o dashboard do card (ex.: escopo é ignorado nos cards de vendas). Se o cálculo
        falhar, a resposta continua 200 e o card volta com "erro" no lugar de "dados",
        igual ao GET /dashboards/{chave}/dados. O formato de "dados" depende do tipo
        do card; veja a seção "Formato dos dados dos cards" do README.'
      parameters:
      - description: 'Código do card (ex.: proj-01, ven-03, ia-12)'
        in: path
        name: codigo
        required: true
        type: string
      - default: projeto
        description: Escopo (projetos e ia)
        enum:
        - projeto
        - time
        - sprint
        in: query
        name: escopo
        type: string
      - description: Id do projeto, time ou sprint, conforme o escopo (obrigatório
          em escopo=sprint)
        in: query
        name: id
        type: integer
      - description: 'Início do período (AAAA-MM-DD). Padrão: 29 dias antes de ate'
        in: query
        name: de
        type: string
      - description: 'Fim do período (AAAA-MM-DD). Padrão: hoje'
        in: query
        name: ate
        type: string
      - description: Tipos de projeto, separados por vírgula (web, mobile, integracao,
          api, outro)
        in: query
        name: tipo_projeto
        type: string
      - description: Status de projeto, separados por vírgula (projetos e ia)
        in: query
        name: status_projeto
        type: string
      - description: Origens de lead, separadas por vírgula (vendas)
        in: query
        name: origem_lead
        type: string
      - description: Modelos de IA, separados por vírgula (ia)
        in: query
        name: modelo
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DadosCardDoc'
        "400":
          description: Filtro inválido
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "403":
          description: Você não tem acesso a este recurso
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "404":
          description: Card inexistente ou inativo
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
      security:
      - BearerAuth: []
      summary: Dados de um card
      tags:
      - cards
  /dashboards:
    get:
      consumes:
      - application/json
      description: Devolve os dashboards ativos que têm ao menos um card ativo permitido
        ao perfil do usuário, com a quantidade desses cards (total_cards). Lista vazia
        se o perfil não vê nenhum.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.ListaDashboardsDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
      security:
      - BearerAuth: []
      summary: Lista os dashboards visíveis
      tags:
      - dashboards
  /dashboards/{chave}:
    get:
      consumes:
      - application/json
      description: Devolve o dashboard e os cards ativos que o perfil pode ver (codigo,
        titulo, descricao e tipo), ordenados por código e sem os dados calculados.
        A descricao é o texto do modal de informação.
      parameters:
      - description: Chave do dashboard
        enum:
        - projetos
        - vendas
        - ia
        in: path
        name: chave
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DashboardDetalheDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "403":
          description: Você não tem acesso a este recurso
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "404":
          description: Dashboard inexistente ou inativo
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
      security:
      - BearerAuth: []
      summary: Detalhe de um dashboard
      tags:
      - dashboards
  /dashboards/{chave}/dados:
    get:
      consumes:
      - application/json
      description: 'Calcula todos os cards que o perfil pode ver no dashboard, para
        os filtros informados, e devolve a lista de resultados (CardResultado) na
        ordem dos códigos. Os cards são calculados em paralelo (até 4 ao mesmo tempo,
        10 s por card). Se um card falhar, o endpoint não falha: aquele card volta
        com "erro" no lugar de "dados". Parâmetros que não valem para o dashboard
        são ignorados (ex.: escopo em vendas). O formato de "dados" depende do tipo
        do card; veja a seção "Formato dos dados dos cards" do README.'
      parameters:
      - description: Chave do dashboard
        enum:
        - projetos
        - vendas
        - ia
        in: path
        name: chave
        required: true
        type: string
      - default: projeto
        description: Escopo (projetos e ia)
        enum:
        - projeto
        - time
        - sprint
        in: query
        name: escopo
        type: string
      - description: Id do projeto, time ou sprint, conforme o escopo (obrigatório
          em escopo=sprint)
        in: query
        name: id
        type: integer
      - description: 'Início do período (AAAA-MM-DD). Padrão: 29 dias antes de ate'
        in: query
        name: de
        type: string
      - description: 'Fim do período (AAAA-MM-DD). Padrão: hoje'
        in: query
        name: ate
        type: string
      - description: Tipos de projeto, separados por vírgula (web, mobile, integracao,
          api, outro)
        in: query
        name: tipo_projeto
        type: string
      - description: 'Status de projeto, separados por vírgula (projetos e ia): em_andamento,
          concluido, pausado, cancelado'
        in: query
        name: status_projeto
        type: string
      - description: Origens de lead, separadas por vírgula (vendas)
        in: query
        name: origem_lead
        type: string
      - description: Modelos de IA, separados por vírgula (ia)
        in: query
        name: modelo
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.DadosDashboardDoc'
        "400":
          description: Filtro inválido
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "403":
          description: Você não tem acesso a este recurso
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "404":
          description: Dashboard inexistente ou inativo
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
      security:
      - BearerAuth: []
      summary: Dados de todos os cards de um dashboard
      tags:
      - dashboards
  /filtros/opcoes:
    get:
      consumes:
      - application/json
      description: 'Devolve as opções para preencher os filtros: tipos e status de
        projeto (valor e rótulo), origens de lead e modelos de IA existentes, projetos,
        times e sprints. Em cada sprint, "atual" indica se hoje (no fuso do app) está
        entre o início e o fim; o front usa isso para pré-selecionar a sprint atual.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.OpcoesFiltrosDoc'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErroDoc'
      security:
      - BearerAuth: []
      summary: Opções dos filtros
      tags:
      - filtros
  /health:
    get:
      consumes:
      - application/json
      description: Devolve o status da API e do banco. Responde 503 se o banco não
        responder ao ping.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.HealthResposta'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/controllers.HealthResposta'
      summary: Verifica a saúde da API
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: Informe o valor no formato "Bearer <token>" (com a palavra Bearer
      e um espaço antes do token).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
